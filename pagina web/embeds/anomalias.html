<!doctype html>

<title>JT-Anomalías</title>
<style>
:root{--bg:#07090c;--grid:#222b31;--cream:#f4efe6;--orange:#e7772a;--teal:#43b7b2;--red:#963b4b;--yellow:#ffe34f;--green:#2f7938;--wine:#672336}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}body{display:grid;place-items:center}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 68% 40%,#152129 0,#090c10 52%,#050607 100%)}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;background-image:radial-gradient(#fff .5px,transparent .5px);background-size:4px 4px}
.frame{position:absolute;inset:2.5%;border:1px solid #2d3a42;border-radius:12px;background:#080b0fe5;box-shadow:0 18px 80px #000a,inset 0 0 50px #1b2a3266;overflow:hidden;animation:frameIn .7s ease-out both}
svg{position:absolute;inset:1.5%;width:97%;height:97%}.grid{stroke:var(--grid);stroke-width:1;opacity:.65}.sep{stroke:#3e4b52;stroke-width:3}.zero{stroke:#aab5b5;stroke-width:1;stroke-dasharray:2 8;opacity:.55}
.wick{stroke:#c8d1d2;stroke-width:1}.up{fill:var(--cream)}.down{fill:var(--orange)}.line{fill:none;stroke:#f0ece2;stroke-width:1.2;opacity:.55}.zone-up{fill:var(--green);fill-opacity:.52;stroke:#64c773;stroke-opacity:.35}.zone-down{fill:var(--wine);fill-opacity:.58;stroke:#c35668;stroke-opacity:.35}
.osc-up{fill:#43b7b414;stroke:var(--teal);stroke-width:1.5}.osc-down{fill:#963b4b18;stroke:var(--red);stroke-width:1.5}.osc-t{fill:none;stroke:#5dc5bd;stroke-width:1.35}.osc-r{fill:none;stroke:#a54758;stroke-width:1.35}.osc-m{fill:none;stroke:#7e8b91;stroke-width:1}.spike-t{stroke:var(--teal);stroke-width:1.5}.spike-r{stroke:#c35d6a;stroke-width:1.5}
.event{opacity:0;transform-box:fill-box;transform-origin:center;animation:event .45s ease-out forwards}.e1{animation-delay:1.5s}.e2{animation-delay:2.05s}.e3{animation-delay:2.65s}.e4{animation-delay:3.25s}.e5{animation-delay:3.8s}.halo{fill:none;stroke:var(--yellow);stroke-width:2;stroke-dasharray:4 6;animation:pulse 1.2s ease-in-out infinite;opacity:.8}.tri-t{fill:var(--teal);stroke:#061012;stroke-width:1}.tri-w{fill:var(--cream);stroke:#111;stroke-width:1}
.scan{position:absolute;top:-10%;bottom:-10%;left:-20%;width:15%;transform:skewX(-17deg);background:linear-gradient(90deg,transparent,#8be4d71d,transparent);animation:scan 2.4s 3.2s linear infinite}
@keyframes frameIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}@keyframes event{0%{opacity:0;transform:scale(.55) translateY(10px)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:none}}@keyframes pulse{0%,100%{opacity:.22;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}@keyframes scan{0%{left:-20%;opacity:0}18%{opacity:1}100%{left:115%;opacity:0}}
</style>
<style>@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head>
